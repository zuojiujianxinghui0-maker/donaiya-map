<meta charset="UTF-8">

<title>どないやマップ ジオコーディング v2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#CC1514;--bg:#f6f5f2}
body{font-family:-apple-system,'Hiragino Sans',sans-serif;background:var(--bg);color:#111;
 font-size:14px;line-height:1.6;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 40px)}
h1{font-size:18px}
.lead{font-size:12px;color:#666;margin-bottom:16px}
.card{background:#fff;border-radius:10px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.card h2{font-size:11px;letter-spacing:.12em;color:var(--red);margin-bottom:10px}
button{width:100%;border:0;border-radius:9px;padding:14px;font-size:15px;font-weight:700;
 background:var(--red);color:#fff;margin-top:8px;-webkit-appearance:none}
button:disabled{background:#bbb}
button.sub{background:#eee;color:#333}
.bar{height:10px;background:#e6e2da;border-radius:5px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;width:0;background:var(--red);transition:width .2s}
.row{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid #f0eee9;font-size:13px}
.row:last-child{border:0}
.ok{color:#1b7f3b;font-weight:700}.ng{color:#c62828;font-weight:700}.wa{color:#b26a00;font-weight:700}
pre{background:#111;color:#8f8;padding:10px;border-radius:8px;font-size:10px;
 max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-all;margin-top:8px}
textarea{width:100%;height:180px;font-family:ui-monospace,monospace;font-size:10px;
 border:1px solid #ddd;border-radius:8px;padding:8px}
.note{font-size:11px;color:#777;margin-top:8px}
.warn{background:#fff4e5;border-radius:8px;padding:10px;font-size:12px;color:#8a5300;margin-bottom:10px}
</style>
</head>
<body>

<h1>ジオコーディング v2</h1>
<p class="lead">前回の失敗はService Workerが通信を横取りしていたためです。まず①で解除してから②を実行してください。</p>

<div class="card">
  <h2>① 準備</h2>
  <div class="row"><span>Service Worker</span><b id="sw-st">確認中</b></div>
  <div class="row"><span>登録数</span><b id="sw-n">-</b></div>
  <button id="kill">Service Workerを解除する</button>
  <p class="note">解除後に自動で再読み込みします。もう一度このページが開いたら②へ進んでください。</p>
</div>

<div class="card">
  <h2>② 変換</h2>
  <div class="row"><span>店舗数</span><b id="n-shop">-</b></div>
  <div class="row"><span>変換する住所</span><b id="n-addr">-</b></div>
  <div class="row"><span>成功</span><b id="n-ok" class="ok">0</b></div>
  <div class="row"><span>失敗</span><b id="n-ng" class="ng">0</b></div>
  <div class="bar"><i id="bar"></i></div>
  <button id="run">変換をはじめる</button>
  <button class="sub" id="test">先に1件だけ試す</button>
</div>

<div class="card" id="c-log" style="display:none">
  <h2>ログ</h2>
  <pre id="log"></pre>
</div>

<div class="card" id="c-out" style="display:none">
  <h2>結果</h2>
  <p class="note">下の内容をすべてコピーしてチャットに貼ってください。</p>
  <textarea id="out" readonly></textarea>
  <button id="copy">すべてコピー</button>
  <button class="sub" id="share">共有・保存</button>
</div>

/* --- Service Worker の状態 --- */
function swCheck(){
  if(!('serviceWorker' in navigator)){ $('sw-st').textContent='非対応'; $('sw-n').textContent='0'; return }
  var ctrl=!!navigator.serviceWorker.controller;
  $('sw-st').textContent = ctrl ? '通信を横取り中' : '解除済み';
  $('sw-st').className = ctrl ? 'ng' : 'ok';
  navigator.serviceWorker.getRegistrations().then(function(rs){
    $('sw-n').textContent=rs.length+'件';
    $('sw-n').className = rs.length ? 'wa' : 'ok';
  });
}
swCheck();

$('kill').addEventListener('click',function(){
  if(!('serviceWorker' in navigator)){alert('この端末は対象外です');return}
  navigator.serviceWorker.getRegistrations().then(function(rs){
    return Promise.all(rs.map(function(r){return r.unregister().catch(function(){})}));
  }).then(function(){
    if(window.caches&&caches.keys) return caches.keys().then(function(k){return Promise.all(k.map(function(x){return caches.delete(x)}))});
  }).then(function(){ alert('解除しました。再読み込みします。'); location.reload(true); });
});

/* --- 変換：地理院 → 失敗時は OpenStreetMap --- */
function gsi(a){
  return fetch('https://msearch.gsi.go.jp/address-search/AddressSearch?q='+encodeURIComponent(a))
   .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json() })
   .then(function(j){ if(!j||!j.length) return null;
     var c=j[0].geometry.coordinates; return {lat:c[1],lng:c[0],src:'地理院'} });
}
function osm(a){
  return fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=jp&q='+encodeURIComponent(a),
   {headers:{'Accept':'application/json'}})
   .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json() })
   .then(function(j){ if(!j||!j.length) return null;
     return {lat:parseFloat(j[0].lat),lng:parseFloat(j[0].lon),src:'OSM'} });
}
function conv(a){
  return gsi(a).catch(function(e){ log('   地理院NG: '+e.message); return null })
    .then(function(r){ return r ? r : osm(a).catch(function(e){ log('   OSM NG: '+e.message); return null }) });
}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

$('test').addEventListener('click',async function(){
  log('テスト: '+addrs[0]);
  var r=await conv(addrs[0]);
  if(r) log('成功 '+r.lat.toFixed(6)+', '+r.lng.toFixed(6)+'  ('+r.src+')');
  else log('失敗。上のログの理由を確認してください。');
});

$('run').addEventListener('click',async function(){
  this.disabled=true; this.textContent='変換中…';
  okN=0; ngN=0; result={};
  log('開始：'+addrs.length+'件');
  for(var i=0;i<addrs.length;i++){
    var a=addrs[i];
    var r=await conv(a);
    if(r){ result[a]=r; okN++; log('OK  '+a+' → '+r.lat.toFixed(6)+', '+r.lng.toFixed(6)+' ('+r.src+')'); }
    else { ngN++; log('NG  '+a); }
    $('n-ok').textContent=okN; $('n-ng').textContent=ngN;
    $('bar').style.width=Math.round((i+1)/addrs.length*100)+'%';
    await sleep(1100);
  }
  log('完了：成功'+okN+' / 失敗'+ngN);
  build(); this.textContent='完了';
});

function build(){
  var o=[];
  o.push('# 結果 成功'+okN+' / 失敗'+ngN+' / 住所'+addrs.length+'件');
  SHOPS.forEach(function(s){
    if(!s.addr){o.push([s.name,'','','','住所なし'].join('\t'));return}
    var r=result[s.addr];
    if(!r){o.push([s.name,s.addr,'','','取得失敗'].join('\t'));return}
    var inR=r.lat>35.70&&r.lat<35.76&&r.lng>139.68&&r.lng<139.75;
    o.push([s.name,s.addr,r.lat.toFixed(7),r.lng.toFixed(7),(inR?'高':'要確認')+'/'+r.src].join('\t'));
  });
  $('out').value=o.join('\n'); $('c-out').style.display='block';
}
$('copy').addEventListener('click',function(){
  var t=$('out'); t.select(); t.setSelectionRange(0,999999);
  if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(function(){alert('コピーしました')});
  else { document.execCommand('copy'); alert('コピーしました'); }
});
$('share').addEventListener('click',function(){
  var b=new Blob([$('out').value],{type:'text/plain'});
  var f=new File([b],'geocode_result.txt',{type:'text/plain'});
  if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({files:[f]});
  else { var u=URL.createObjectURL(b),a=document.createElement('a'); a.href=u; a.download='geocode_result.txt'; a.click(); }
});
