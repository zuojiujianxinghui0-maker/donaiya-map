function normalize(str){
  return str.toLowerCase()
    .replace(/[゠-ヿ]/g, function(m) {return String.fromCharCode(m.charCodeAt(1)+0xFEE0);})
    .replace(/[぀-ゟ]/g, function(m) {return String.fromCharCode(m.charCodeAt(1)-0xFEC0);});
}
function scoreMatch(q, text){
  if(!q || !text) return 0;
  const nq = normalize(q);
  const nt = normalize(text);
  if(nt === nq) return 300;
  if(nt.includes(nq)) return 150;
  if(nt.includes(q) || text.includes(q)) return 100;
  let score = 0;
  for(let i=0;i<nq.length;i++){
    if(nt.includes(nq[i])) score += 10;
  }
  return score > 0 ? score : 0;
}
function render(list){
  const ul = document.getElementById('storeList');
  const count = document.getElementById('count');
  count.textContent = list.length;
  if(list.length===0){
    ul.innerHTML = '<li class="empty">🔍 該当する店舗がありません</li>';
    return;
  }
  ul.innerHTML = list.map(s=>`
    <li class="store">
      <div class="store-name">${s.n}</div>
      <div class="store-addr">${s.a}</div>
      <div class="store-actions">
        <a href="https://www.google.com/maps/dir/?api=1&destination=${s.lt},${s.ln}" target="_blank">🚶 経路</a>
        <a class="dir" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(s.n)}" target="_blank">📍 場所</a>
      </div>
    </li>
  `).join('');
}
render(s);
function filterStores(){
  const q = document.getElementById('search').value.trim();
  if(!q){
    render(s);
    return;
  }
  const scored = s.map(st=>({
    ...st,
    score: Math.max(
      scoreMatch(q, st.n),
      scoreMatch(q, st.a),
      scoreMatch(q, st.b)
    )
  })).filter(x=>x.score > 0).sort((a,b)=>b.score-a.score);
  render(scored.map(x=>({n:x.n,a:x.a,b:x.b,lt:x.lt,ln:x.ln,t:x.t})));
}
