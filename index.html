<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#0d0d0d;color:#fff;-webkit-font-smoothing:antialiased;overflow:hidden;height:100vh}
#app{height:100vh;display:flex;flex-direction:column}

/* Header */
.header{background:#111;padding:14px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,0.06)}
.header .logo{width:34px;height:34px;background:#c41e1e;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;flex-shrink:0}
.header h1{font-size:17px;font-weight:800;letter-spacing:0.5px;color:#fff}
.header .count{font-size:11px;color:rgba(255,255,255,0.4);margin-left:auto}

/* Search */
.search-wrap{padding:10px 14px;background:#0d0d0d;border-bottom:1px solid rgba(255,255,255,0.04)}
.search-wrap input{width:100%;padding:11px 14px;background:#1a1a1a;border:1px solid rgba(255,255,255,0.08);border-radius:10px;font-size:15px;outline:none;color:#fff;transition:border 0.2s}
.search-wrap input::placeholder{color:rgba(255,255,255,0.25)}
.search-wrap input:focus{border-color:#c41e1e}

/* List */
.list-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 14px 20px}
.list-wrap::-webkit-scrollbar{width:4px}
.list-wrap::-webkit-scrollbar-thumb{background:rgba(196,30,30,0.3);border-radius:2px}

/* Building group header */
.bldg-header{display:flex;align-items:center;gap:8px;padding:12px 14px 6px;font-size:13px;font-weight:700;color:rgba(255,255,255,0.7);letter-spacing:0.3px;margin-top:4px}
.bldg-header .bldg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bldg-header .bldg-count{font-size:11px;color:rgba(255,255,255,0.3);font-weight:400;margin-left:auto}

/* Card */
.item{background:#181818;border-radius:12px;padding:14px 14px 12px;margin:6px 0;border:1px solid rgba(255,255,255,0.04)}
.item .name{font-size:17px;font-weight:700;color:#fff;margin-bottom:4px;line-height:1.3}
.item .name .tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:4px;margin-left:8px;vertical-align:middle;font-weight:600;letter-spacing:0.3px}
.item .name .tag.west{background:rgba(102,126,234,0.15);color:#8b9cf7}
.item .name .tag.east{background:rgba(240,147,251,0.15);color:#f0a0f0}
.item .name .tag.north{background:rgba(79,172,254,0.15);color:#6bb8fe}
.item .name .tag.central{background:rgba(67,233,123,0.15);color:#5eeb8a}

/* Building badge */
.item .bldg-badge{display:inline-flex;align-items:center;gap:4px;font-size:10px;padding:2px 7px;border-radius:4px;margin-left:6px;font-weight:600;vertical-align:middle}

/* 住所 */
.item .addr{font-size:12px;color:rgba(255,255,255,0.45);line-height:1.5;margin-bottom:8px}

/* 距離行 */
.item .dist-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:12px}
.item .dist-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-weight:600;font-size:11px}
.item .dist-badge.near{background:rgba(67,233,123,0.12);color:#43e97b}
.item .dist-badge.mid{background:rgba(251,191,36,0.12);color:#fbbf24}
.item .dist-badge.far{background:rgba(239,68,68,0.12);color:#ef4444}
.item .dist-text{color:rgba(255,255,255,0.5);font-weight:400}
.item .area-text{color:rgba(255,255,255,0.3);margin-left:auto}

/* アクションボタン */
.item .actions{display:flex;gap:8px}
.item .actions a{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:10px 0;border-radius:8px;font-size:12px;font-weight:700;text-decoration:none;transition:all 0.12s;border:1px solid transparent}
.item .actions a:active{transform:scale(0.97)}
.item .actions .route{background:rgba(196,30,30,0.1);color:#ff4d4d;border-color:rgba(196,30,30,0.12)}
.item .actions .route:active{background:rgba(196,30,30,0.2)}
.item .actions .place{background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.65);border-color:rgba(255,255,255,0.08)}
.item .actions .place:active{background:rgba(255,255,255,0.1)}

/* No result */
.noresult{padding:50px 20px;text-align:center;color:rgba(255,255,255,0.3);font-size:14px;line-height:1.8}
.noresult span{font-size:40px;display:block;margin-bottom:12px}

/* Map overlay */
#mapWrap{position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;background:#000;display:none;flex-direction:column}
#mapWrap.active{display:flex}
.map-header{display:flex;align-items:center;padding:12px 14px;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);z-index:10;gap:10px}
.map-header .back{width:36px;height:36px;border:none;border-radius:50%;background:rgba(255,255,255,0.08);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.map-header .back:active{background:rgba(255,255,255,0.15)}
.map-header .shop-name{font-size:14px;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.map-body{flex:1;position:relative;background:#111}
.map-body iframe{width:100%;height:100%;border:none}
.map-actions{display:flex;gap:10px;padding:14px 16px;position:absolute;bottom:0;left:0;right:0;z-index:10;background:linear-gradient(transparent,rgba(0,0,0,0.5) 25%,rgba(0,0,0,0.95))}
.map-actions a{flex:1;text-decoration:none;padding:14px 0;border-radius:10px;font-size:14px;font-weight:700;text-align:center;transition:transform 0.1s}
.map-actions a:active{transform:scale(0.96)}
.map-actions .place{background:#c41e1e;color:#fff}
.map-actions .route{background:rgba(255,255,255,0.1);color:#fff;border:1px solid rgba(255,255,255,0.12)}
</style>

function haversineKm(l1,ln1,l2,ln2){
const R=6371;const dL=(l2-l1)*Math.PI/180;const dN=(ln2-ln1)*Math.PI/180;
const a=Math.sin(dL/2)**2+Math.cos(l1*Math.PI/180)*Math.cos(l2*Math.PI/180)*Math.sin(dN/2)**2;
return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function dClass(x){
if(!x.lt||!x.ln)return'mid';
const d=haversineKm(CENTER.lat,CENTER.lng,x.lt,x.ln);
return d<=DIST_NEAR?'near':d<=DIST_MID?'mid':'far';
}
function dMeters(x){
if(!x.lt||!x.ln)return'?';
return Math.round(haversineKm(CENTER.lat,CENTER.lng,x.lt,x.ln)*1000);
}

function norm(s){
if(!s)return'';
return s.toLowerCase()
.replace(/[Ａ-Ｚａ-ｚ０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-0xFEE0))
.replace(/[ァ-ヶ]/g,c=>String.fromCharCode(c.charCodeAt(0)-0x60))
.normalize('NFD').replace(/[ー―‐]/g,'')
.replace(/[ぁぃぅぇぉっゃゅょ]/g,c=>{const m={ぁ:'あ',ぃ:'い',ぅ:'う',ぇ:'え',ぉ:'お',っ:'つ',ゃ:'や',ゅ:'ゆ',ょ:'よ'};return m[c]||c})
.replace(/[\s\u3000]/g,'');
}

let idx;
function buildIdx(){
idx={};
data.forEach((x,i)=>{
const t=norm(x.n+' '+(x.y||'')+' '+x.b+' '+(BLDG_YOMI[x.b]||''));
for(let j=0;j<t.length-1;j++){const g=t.substring(j,j+2);if(!idx[g])idx[g]=new Set();idx[g].add(i)}
});
}
function intersect(a,b){const r=new Set();for(const v of a)if(b.has(v))r.add(v);return r}
function score(q,x){
const nq=norm(q),nn=norm(x.n),nb=norm(x.b),ny=x.y?norm(x.y):'';
let s=0;
if(nn===nq)s+=1000;else if(nn.startsWith(nq))s+=500;else if(nn.includes(nq))s+=300;
if(ny===nq)s+=800;else if(ny.startsWith(nq))s+=400;else if(ny.includes(nq))s+=200;
if(nb.includes(nq))s+=50;s+=nq.length*2;
return s;
}
function search(q){
const v=norm(q);
if(!v||!idx)return render(data);
let c=null;
for(let i=0;i<v.length-1;i++){const g=v.substring(i,i+1);const ids=idx[g];if(!ids){render([]);return}c=c?intersect(c,ids):ids}
if(!c||c.size===0){render(data.filter(x=>norm(x.n).includes(v)||(x.y&&norm(x.y).includes(v))||norm(x.b).includes(v)));return}
const sc=[...c].map(i=>({x:data[i],s:score(v,data[i]),i})).sort((a,b)=>b.s-a.s);
render(sc.map(s=>s.x));
}

'</div>'+
'<div class="actions">'+
'<a class="route" href="https://www.google.com/maps/dir/?api=1&destination='+lat+','+lng+'&travelmode=walking&hl=ja" target="_blank" rel="noopener" onclick="event.stopPropagation()">🚶 経路</a>'+
'<a class="place" href="https://maps.google.com/?q='+label+'&ll='+lat+','+lng+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">📍 場所</a>'+
'</div>';
l.appendChild(d)
});
}
