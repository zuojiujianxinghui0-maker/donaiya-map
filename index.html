*{margin:0;padding:0;box-sizing:border-box}

#app{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden}

/* 上部：検索を最優先に配置 */
.searchbar{

}

.build{text-align:center;font-size:11px;color:#bbb;padding:16px 0 4px}

const CENTER=[35.733624,139.709896];


function distLabel(m){var d=Math.round(N([m.lat,m.lng],CENTER));return d<200?'近':d<400?'中':'遠'}
function distClass(m){var d=Math.round(N([m.lat,m.lng],CENTER));return d<200?'near':d<400?'mid':'far'}

function N(a,b){var R=6371e3;var dL=((b[0]-a[0])*Math.PI/180);var dL2=((b[1]-a[1])*Math.PI/180);var a2=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dL2/2)*Math.sin(dL2/2);return 2*R*Math.atan2(Math.sqrt(a2),Math.sqrt(1-a2))}

/* ========== 検索の正規化 ==========
   ひらがな⇄カタカナ / 全角⇄半角 / 階数表記 / 記号ゆれ を吸収 */
function norm(s){
  if(!s) return '';
  s=String(s);
  // 全角英数字・記号 → 半角
  s=s.replace(/[Ａ-Ｚａ-ｚ０-９]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)});
  // 半角カタカナ → 全角カタカナ（濁点・半濁点の合成を先に処理）
  var HKD={'ｶﾞ':'ガ','ｷﾞ':'ギ','ｸﾞ':'グ','ｹﾞ':'ゲ','ｺﾞ':'ゴ','ｻﾞ':'ザ','ｼﾞ':'ジ','ｽﾞ':'ズ','ｾﾞ':'ゼ','ｿﾞ':'ゾ','ﾀﾞ':'ダ','ﾁﾞ':'ヂ','ﾂﾞ':'ヅ','ﾃﾞ':'デ','ﾄﾞ':'ド','ﾊﾞ':'バ','ﾋﾞ':'ビ','ﾌﾞ':'ブ','ﾍﾞ':'ベ','ﾎﾞ':'ボ','ﾊﾟ':'パ','ﾋﾟ':'ピ','ﾌﾟ':'プ','ﾍﾟ':'ペ','ﾎﾟ':'ポ','ｳﾞ':'ヴ'};
  s=s.replace(/[ｶ-ﾎｳ][ﾞﾟ]/g,function(c){return HKD[c]||c});
  var HK1={'｡':'。','｢':'「','｣':'」','､':'、','･':'・','ｦ':'ヲ','ｧ':'ァ','ｨ':'ィ','ｩ':'ゥ','ｪ':'ェ','ｫ':'ォ','ｬ':'ャ','ｭ':'ュ','ｮ':'ョ','ｯ':'ッ','ｰ':'ー','ｱ':'ア','ｲ':'イ','ｳ':'ウ','ｴ':'エ','ｵ':'オ','ｶ':'カ','ｷ':'キ','ｸ':'ク','ｹ':'ケ','ｺ':'コ','ｻ':'サ','ｼ':'シ','ｽ':'ス','ｾ':'セ','ｿ':'ソ','ﾀ':'タ','ﾁ':'チ','ﾂ':'ツ','ﾃ':'テ','ﾄ':'ト','ﾅ':'ナ','ﾆ':'ニ','ﾇ':'ヌ','ﾈ':'ネ','ﾉ':'ノ','ﾊ':'ハ','ﾋ':'ヒ','ﾌ':'フ','ﾍ':'ヘ','ﾎ':'ホ','ﾏ':'マ','ﾐ':'ミ','ﾑ':'ム','ﾒ':'メ','ﾓ':'モ','ﾔ':'ヤ','ﾕ':'ユ','ﾖ':'ヨ','ﾗ':'ラ','ﾘ':'リ','ﾙ':'ル','ﾚ':'レ','ﾛ':'ロ','ﾜ':'ワ','ﾝ':'ン'};
  s=s.replace(/[\uFF61-\uFF9F]/g,function(c){return HK1[c]||c});
  // ひらがな → カタカナ（検索キーをカタカナに統一）
  s=s.replace(/[\u3041-\u3096]/g,function(c){return String.fromCharCode(c.charCodeAt(0)+0x60)});
  // 階数表記の統一： 階/Ｆ/ｆ → f
  s=s.replace(/階/g,'f');
  // 長音・ハイフン類をすべて同一視
  s=s.replace(/[\u30FC\u2010-\u2015\u2212\uFF0D\-]/g,'');
  // 空白と中黒を除去
  s=s.replace(/[\s\u3000\u30FB\u00B7]/g,'');
  return s.toLowerCase();
}

/* ビル名の号数ゆれ（第II / 第2 / 第二）を統一 */
function normalizeBldg(s){
  if(!s) return '';
  return String(s)
    .replace(/第\s*(II|Ⅱ|２|2)/g,'第二')
    .replace(/第\s*(I|Ⅰ|１|1)(?![IⅠ])/g,'第一')
    .replace(/第\s*(III|Ⅲ|３|3)/g,'第三')
    .replace(/第\s*(IV|Ⅳ|４|4)/g,'第四')
    .replace(/第\s*(５|5)/g,'第五')
    .replace(/第\s*(８|8)/g,'第八')
    .replace(/第\s*(10|１０)/g,'第十');
}

/* 検索対象の文字列を1店舗ぶん組み立てる */
function haystack(s){
  return [
    s.name,
    SHOP_YOMI[s.name]||'',
    s.bldg||'',
    normalizeBldg(s.bldg||''),
    BLDG_YOMI[s.bldg]||'',
    s.addr||'',
    (s.addr||'').replace(/東京都豊島区/,''),
    s.floor||''
  ].join(' ');
}

/* ========== 検索 ========== */
/* 「バー」「クラブ」等の共通接頭語を落とした核を返す
   norm() を通した後の文字列に対して使うため、接頭語側も norm() で揃える */
var PREFIX_RAW=['ガールズバー','アミューズメントバー','ミュージックバー','コンカフェ','ラウンジ','クラブ','スナック','カフェ','ホテル','バー',
                'girlsbar','amusementbar','musicbar','lounge','club','snack','cafe','hotel','bar'];
var PREFIXES=null;
function core(t){
  if(!PREFIXES){
    PREFIXES=PREFIX_RAW.map(norm).filter(Boolean).sort(function(a,b){return b.length-a.length});
  }
  var v=t;
  for(var i=0;i<3;i++){
    var hit=false;
    for(var j=0;j<PREFIXES.length;j++){
      var p=PREFIXES[j];
      if(p && v.length>p.length && v.indexOf(p)===0){ v=v.slice(p.length); hit=true; break; }
    }
    if(!hit) break;
  }
  return v||t;
}

function scoreOf(s,nq,rawq){
  var n=norm(s.name), y=norm(SHOP_YOMI[s.name]||'');
  var b=norm(normalizeBldg(s.bldg||'')), by=norm(normalizeBldg(BLDG_YOMI[s.bldg]||''));
  var a=norm(s.addr||''), f=norm(s.floor||'');
  var cn=core(n), cy=core(y);

  // 店名系：合算せず最も強い一致だけを採る（語頭ほど高い）
  function m(str,cstr){
    if(!str) return 0;
    if(str===nq) return 1000;
    if(cstr && cstr===nq) return 900;
    if(str.indexOf(nq)===0) return 800;
    if(cstr && cstr.indexOf(nq)===0) return 700;
    if(str.indexOf(nq)!==-1) return 400;
    return 0;
  }
  var nameScore=Math.max(m(n,cn), m(y,cy)*0.95);

  // 建物系
  var bldgScore=0;
  if(b===nq) bldgScore=300;
  else if(b.indexOf(nq)===0) bldgScore=240;
  else if(b.indexOf(nq)!==-1) bldgScore=180;
  else if(by.indexOf(nq)!==-1) bldgScore=140;

  var sc=Math.max(nameScore,bldgScore);
  if(sc===0){
    if(a.indexOf(nq)!==-1) sc=100;
    else if(f.indexOf(nq)!==-1) sc=60;
  }else{
    if(a.indexOf(nq)!==-1) sc+=20;
    if(f.indexOf(nq)!==-1) sc+=10;
    if(nameScore>0 && bldgScore>0) sc+=30;
  }
  // 核が短い店ほど、その語の占める比重が高い
  if(sc>0 && cn.length) sc+=Math.max(0,30-cn.length);
  return sc;
}

function doSearch(q){
  var query=(q!==undefined?q:searchInput.value).trim();
  if(!query){render(SHOPS);return}
  // 空白区切りのAND検索
  var terms=query.split(/[\s\u3000]+/).filter(Boolean)
    .map(function(t){return norm(normalizeBldg(t))}).filter(Boolean);
  if(terms.length===0){render(SHOPS);return}

  var scored=[];
  SHOPS.forEach(function(s){
    var hay=norm(haystack(s));
    var ok=true, total=0;
    for(var i=0;i<terms.length;i++){
      if(hay.indexOf(terms[i])===-1){ok=false;break}
      total+=scoreOf(s,terms[i],query);
    }
    if(ok) scored.push({s:s,score:total});
  });
  scored.sort(function(a,b){return b.score-a.score});
  render(scored.map(function(x){return x.s}));
}

/* ===== 距離・方位 ===== */
function distM(a,b){
  var R=6371e3;
  var d1=(b[0]-a[0])*Math.PI/180, d2=(b[1]-a[1])*Math.PI/180;
  var x=Math.sin(d1/2)*Math.sin(d1/2)+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(d2/2)*Math.sin(d2/2);
  return 2*R*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function bearing(a,b){
  var y=Math.sin((b[1]-a[1])*Math.PI/180)*Math.cos(b[0]*Math.PI/180);
  var x=Math.cos(a[0]*Math.PI/180)*Math.sin(b[0]*Math.PI/180)-
        Math.sin(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.cos((b[1]-a[1])*Math.PI/180);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
var DIRS=['北','北東','東','南東','南','南西','西','北西'];
function dirName(deg){ return DIRS[Math.round(deg/45)%8] }
function dirArrow(deg){ return ['↑','↗','→','↘','↓','↙','←','↖'][Math.round(deg/45)%8] }
function fmtM(m){ return m<1000 ? Math.round(m)+'m' : (m/1000).toFixed(1)+'km' }

/* 徒歩の所要目安（分速80m） */
function walkMin(m){ return Math.max(1,Math.round(m/80)) }

/* 現在地（取れなければ池袋駅を基準にする） */
var userPos=null;
function basePos(){ return userPos || CENTER }
function distOf(s){ return distM(basePos(),[s.lat,s.lng]) }
function distClass2(s){ var d=distOf(s); return d<200?'near':d<400?'mid':'far' }

/* その店に一番近い目印 */
function nearestLandmark(s){
  var best=null,bd=1e9;
  for(var i=0;i<LANDMARKS.length;i++){
    var d=distM([s.lat,s.lng],[LANDMARKS[i].lat,LANDMARKS[i].lng]);
    if(d<bd){bd=d;best=LANDMARKS[i]}
  }
  if(!best) return '';
  var b=bearing([best.lat,best.lng],[s.lat,s.lng]);
  return best.n+'から'+dirName(b)+'へ'+fmtM(bd);
}

    {key:'gsi',   name:'地理院',  url:'https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', max:18, attr:'国土地理院'},
    {key:'pale',  name:'淡色',    url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', max:18, attr:'国土地理院'},
    {key:'carto', name:'シンプル', url:'https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png', max:19, attr:'&copy; CARTO'},
    {key:'photo', name:'航空写真', url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg', max:18, attr:'国土地理院'}
  ];
  var current=null, srcIndex=0, failCount=0, switching=false;
  var srcSel=document.getElementById('mapSrc');

  function makeLayer(src){
    var lyr=L.tileLayer(src.url,{maxZoom:20,maxNativeZoom:src.max,attribution:src.attr});
    lyr.on('tileerror',function(){
      failCount++;
      if(failCount>=4 && !switching && srcIndex<SOURCES.length-1){
        switching=true; srcIndex++; failCount=0; useSource(srcIndex);
        setTimeout(function(){switching=false},1500);
      }
    });
    lyr.on('tileload',function(){failCount=0});
    return lyr;
  }
  function useSource(i){
    if(current) map.removeLayer(current);
    current=makeLayer(SOURCES[i]); current.addTo(map);
    try{localStorage.setItem('mapSrc',SOURCES[i].key)}catch(e){}
    if(srcSel) srcSel.value=SOURCES[i].key;
  }
  var startKey='osmjp';
  try{ startKey=localStorage.getItem('mapSrc')||'osmjp' }catch(e){}
  for(var si=0;si<SOURCES.length;si++){ if(SOURCES[si].key===startKey){srcIndex=si;break} }
  useSource(srcIndex);
  if(srcSel) srcSel.addEventListener('change',function(){
    for(var i=0;i<SOURCES.length;i++){
      if(SOURCES[i].key===this.value){srcIndex=i;failCount=0;useSource(i);break}
    }
  });

  /* 目印レイヤー */
  lmLayer=L.layerGroup();
  LANDMARKS.forEach(function(l){
    var isExit=l.t==='exit';
    L.marker([l.lat,l.lng],{
      icon:L.divIcon({className:'lm-icon',
        html:'<span class="lm '+(isExit?'exit':'bldg')+'">'+(isExit?'🚉':'🏢')+' '+l.n+'</span>',
        iconSize:null,iconAnchor:[0,8]}),
      interactive:false, zIndexOffset:-500
    }).addTo(lmLayer);
  });
  lmLayer.addTo(map);
  map.on('zoomend',function(){
    if(map.getZoom()<16){ if(map.hasLayer(lmLayer)) map.removeLayer(lmLayer) }
    else { if(!map.hasLayer(lmLayer)) lmLayer.addTo(map) }
  });

  /* 店舗マーカー */
  SHOPS.forEach(function(s,i){
    var m=L.circleMarker([s.lat,s.lng],{
      radius:8,color:'#fff',weight:2.5,fillColor:'#CC1514',fillOpacity:1
    });
    m.on('click',function(){ selectShop(i,false) });
    markers.push(m); markerByIndex[i]=m;
  });

  showMarkers(SHOPS);
  setTimeout(function(){map.invalidateSize()},200);
  startLocate();
}

function popupHtml(s,i){
  var d=distOf(s), b=bearing(basePos(),[s.lat,s.lng]);
  var here=userPos?'現在地':'池袋駅';
  return '<b>'+esc(s.name)+'</b>'+(s.floor?' <span class="pf">'+esc(s.floor)+'</span>':'')+
    '<br>'+esc(s.bldg||'')+
    (s.addr?'<br><small>'+esc(s.addr)+'</small>':'')+
    '<br><span class="pd">'+dirArrow(b)+' '+here+'から'+dirName(b)+' '+fmtM(d)+'・徒歩'+walkMin(d)+'分</span>'+
    '<br><small>'+esc(nearestLandmark(s))+'</small>'+
    '<br><a href="'+routeUrl(s)+'">経路案内を開く</a>';
}

/* 店を選ぶ：地図を寄せ、現在地から線を引く */
function selectShop(i,fromList){
  selectedIdx=i;
  var s=SHOPS[i], m=markerByIndex[i];
  if(map&&m){
    m.bindPopup(popupHtml(s,i)).openPopup();
    if(fromList) map.setView(m.getLatLng(),18,{animate:true});
  }
  drawRoute();
  focusCard(i);
}

function drawRoute(){
  if(!map) return;
  if(routeLine){ map.removeLayer(routeLine); routeLine=null }
  if(selectedIdx===null || !userPos) return;
  var s=SHOPS[selectedIdx];
  routeLine=L.polyline([userPos,[s.lat,s.lng]],{
    color:'#CC1514',weight:3,opacity:.8,dashArray:'8,6'
  }).addTo(map);
}

/* 現在地 */
function startLocate(){
  if(!navigator.geolocation) return;
  navigator.geolocation.watchPosition(function(p){
    var first=!userPos;
    userPos=[p.coords.latitude,p.coords.longitude];
    if(!map) return;
    if(meMarker) map.removeLayer(meMarker);
    if(meCircle) map.removeLayer(meCircle);
    meCircle=L.circle(userPos,{radius:Math.min(p.coords.accuracy||30,80),
      color:'#1a73e8',weight:1,fillColor:'#1a73e8',fillOpacity:.12}).addTo(map);
    meMarker=L.circleMarker(userPos,{radius:7,color:'#fff',weight:3,
      fillColor:'#1a73e8',fillOpacity:1}).addTo(map);
    meMarker.bindPopup('現在地');
    drawRoute();
    if(first){ map.setView(userPos,17); doSearch(searchInput.value) }
    else { render(lastShops,false) }
  },function(){},{enableHighAccuracy:true,maximumAge:15000,timeout:12000});
}

function showMarkers(shops,fit){
  if(!map)return;
  if(fit===undefined) fit=true;
  markers.forEach(function(m){if(map.hasLayer(m))map.removeLayer(m)});
  var pts=[];
  shops.forEach(function(s){
    var i=SHOPS.indexOf(s); var m=markerByIndex[i];
    if(m){m.addTo(map);pts.push([s.lat,s.lng])}
  });
  if(pts.length===0){map.setView(CENTER,16);return}
  if(!fit) return;
  if(pts.length===1){map.setView(pts[0],18);return}
  if(pts.length===SHOPS.length){ return }
  try{map.fitBounds(pts,{padding:[35,35],maxZoom:18})}catch(e){}
}

function focusCard(i){
  var el=document.querySelector('[data-idx="'+i+'"]');
  if(!el)return;
  document.querySelectorAll('.shop-card.hit').forEach(function(c){c.classList.remove('hit')});
  el.classList.add('hit');
  el.scrollIntoView({behavior:'smooth',block:'center'});
}

/* ===== 描画 ===== */
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

var lastShops=[];
function render(shops,fitMap){
  if(fitMap===undefined) fitMap=true;
  lastShops=shops;
  count.textContent=shops.length;
  list.innerHTML='';
  if(shops.length===0){
    list.innerHTML='<div class="no-result"><div class="big">😕</div>該当する店舗がありません</div>';
    showMarkers([],false); return;
  }
  var here=userPos?'現在地':'池袋駅';
  shops.forEach(function(s){
    var idx=SHOPS.indexOf(s);
    var d=distOf(s), b=bearing(basePos(),[s.lat,s.lng]);
    var floorHtml=s.floor?'<span class="floor">'+esc(s.floor)+'</span>':'';
    var addrHtml=s.addr?'<span class="addr">'+esc(s.addr)+'</span>':'';
    var card=document.createElement('div');
    card.className='shop-card';
    card.setAttribute('data-idx',idx);
    card.innerHTML=
      '<div class="name">'+esc(s.name)+floorHtml+'</div>'+
      '<div class="meta"><span class="bldg">'+esc(s.bldg||'')+addrHtml+'</span>'+
        '<span class="dist-badge '+distClass2(s)+'">'+dirArrow(b)+' '+fmtM(d)+'</span></div>'+
      '<div class="guide">'+dirArrow(b)+' '+here+'から'+dirName(b)+'・徒歩'+walkMin(d)+'分'+
        '<span class="lmk">'+esc(nearestLandmark(s))+'</span></div>'+
      '<div class="actions">'+
        '<a class="btn-map" href="'+mapsUrl(s)+'">📍 地図で開く</a>'+
        '<a class="btn-route" href="'+routeUrl(s)+'">🚶 経路案内</a>'+
      '</div>';
    card.addEventListener('click',function(e){
      if(e.target.tagName==='A')return;
      selectShop(idx,true);
    });
    list.appendChild(card);
  });
  var f=document.createElement('div');
  f.className='build'; f.textContent='build 31';
  list.appendChild(f);
  showMarkers(shops,fitMap);
}

/* ===== 地図の折り畳み ===== */
var mapEl=document.getElementById('map');
var mapBtn=document.getElementById('mapToggle');
function setFold(folded){
  if(!mapAvailable) return;
  if(folded) mapEl.classList.add('folded'); else mapEl.classList.remove('folded');
  mapBtn.style.opacity = folded ? '.55' : '1';
  try{ localStorage.setItem('mapFolded', folded?'1':'0') }catch(e){}
  if(!folded && map) setTimeout(function(){map.invalidateSize()},220);
}
if(mapBtn) mapBtn.addEventListener('click',function(){
  setFold(!mapEl.classList.contains('folded'));
});
var startFolded=false;
try{ startFolded = localStorage.getItem('mapFolded')==='1' }catch(e){}

/* ===== 検索クリア ===== */
var clearBtn=document.getElementById('clearBtn');
function syncClear(){ if(searchInput.value.trim()) clearBtn.classList.add('on'); else clearBtn.classList.remove('on') }
if(clearBtn) clearBtn.addEventListener('click',function(){
  searchInput.value=''; syncClear(); selectedIdx=null; drawRoute();
  render(SHOPS); searchInput.focus();
});

/* ===== 起動 ===== */
searchInput.addEventListener('input',function(){syncClear();doSearch(this.value)});
initMap();
setFold(startFolded);
render(SHOPS);
window.addEventListener('resize',function(){if(map)map.invalidateSize()});
</script>
<script>
/* 旧 Service Worker が地図タイルを止めていたため、
   一度だけ古い世代を完全に掃除してから新しい sw.js を登録する */
(function(){
  if(!('serviceWorker' in navigator)) return;
  var FLAG='swReset13';
  var done=false;
  try{ done = localStorage.getItem(FLAG)==='1' }catch(e){}

  function registerNew(){
    navigator.serviceWorker.register('./sw.js').then(function(reg){
      reg.addEventListener('updatefound',function(){
        var w=reg.installing;
        if(!w) return;
        w.addEventListener('statechange',function(){
          if(w.state==='installed' && navigator.serviceWorker.controller){
            w.postMessage('SKIP_WAITING');
          }
        });
      });
    }).catch(function(){});
  }

  if(done){ registerNew(); return }

  Promise.resolve()
    .then(function(){
      return navigator.serviceWorker.getRegistrations().then(function(rs){
        return Promise.all(rs.map(function(r){ return r.unregister().catch(function(){}) }));
      });
    })
    .then(function(){
      if(window.caches && caches.keys){
        return caches.keys().then(function(ks){
          return Promise.all(ks.map(function(k){ return caches.delete(k).catch(function(){}) }));
        });
      }
    })
    .then(function(){
      try{ localStorage.setItem(FLAG,'1') }catch(e){}
      registerNew();
    })
    .catch(function(){ registerNew() });
})();
</script>
