<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="どないや">
<link rel="apple-touch-icon" href="/icon_180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon_192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon_512.png">
<link rel="manifest" href="/manifest.json">
<title>どないや店舗ナビ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#333;-webkit-font-smoothing:antialiased}
.header{background:#E60012;color:#fff;padding:16px;text-align:center;font-size:18px;font-weight:700;position:sticky;top:0;z-index:100}
.search-wrap{padding:12px;background:#f5f5f5}
.search-wrap input{width:100%;padding:10px 14px;border:1px solid #ddd;border-radius:8px;font-size:16px;outline:none}
.search-wrap input:focus{border-color:#E60012}
.list{padding:8px 12px}
.item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #eee;cursor:pointer}
.item img{width:60px;height:60px;border-radius:8px;margin-right:12px;object-fit:cover}
.item .info{flex:1}
.item .name{font-size:15px;font-weight:700;margin-bottom:2px}
.item .area{font-size:12px;color:#999}
.item .dist{font-size:11px;color:#bbb;margin-top:2px}
.item .tag{display:inline-block;background:#E60012;color:#fff;font-size:10px;padding:2px 6px;border-radius:3px;margin-left:6px;vertical-align:middle}
.noresult{padding:24px;text-align:center;color:#999;font-size:14px}
#map{width:100%;height:100%;position:absolute;top:0;left:0}
.map-wrap{position:relative;width:100%;height:calc(100vh - 48px)}
.map-wrap .back{position:absolute;top:12px;left:12px;z-index:10;background:#fff;border:none;border-radius:50%;width:40px;height:40px;box-shadow:0 2px 6px rgba(0,0,0,0.2);cursor:pointer;font-size:20px;display:flex;align-items:center;justify-content:center}
.map-wrap .shop-name{position:absolute;top:12px;left:60px;z-index:10;background:#fff;padding:8px 16px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.2);font-size:14px;font-weight:700}
.map-wrap .open-btn{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;background:#E60012;color:#fff;border:none;border-radius:8px;padding:10px 24px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(230,0,18,0.4);cursor:pointer}
.hidden{display:none}
</style>
</head>
<body>
<div id="app">
<div class="header" id="header">どないや店舗ナビ</div>
<div class="search-wrap"><input id="search" placeholder="店舗を検索…" oninput="search(this.value)"></div>
<div class="list" id="list"></div>
<div class="map-wrap hidden" id="mapWrap">
<button class="back" onclick="back()">‹</button>
<div class="shop-name" id="shopName"></div>
<div id="map"></div>
<a class="open-btn" id="openBtn" target="_blank" rel="noopener">Googleマップで開く</a>
</div>
</div>
<script>
const data=[
{n:"どないや 本店",a:"本店",b:"東京都豊島区南池袋1-26-6 美登利ビル1F",lt:35.726538,ln:139.711866,t:"https://maps.google.com/?q=どないや+本店"},
{n:"どないや 2号店",a:"2号店",b:"東京都豊島区南池袋2-14-1",lt:35.724188,ln:139.714992,t:"https://maps.google.com/?q=どないや+2号店"},
{n:"どないや サンシャインシティ",a:"サンシャイン",b:"東京都豊島区東池袋3-1-1 サンシャインシティ",lt:35.728701,ln:139.718278,t:"https://maps.google.com/?q=どないや+サンシャインシティ"},
{n:"どないや 西口店",a:"西口",b:"東京都豊島区西池袋1-33-6",lt:35.730205,ln:139.708195,t:"https://maps.google.com/?q=どないや+西口店"},
{n:"どないや 東口店",a:"東口",b:"東京都豊島区東池袋1-3-4",lt:35.731948,ln:139.713621,t:"https://maps.google.com/?q=どないや+東口店"}
];
function q(s){return document.querySelector(s)}
function render(items){const l=q('#list');l.innerHTML='';if(!items.length){l.innerHTML='<div class="noresult">店舗が見つかりません</div>';return}
items.forEach(x=>{const d=document.createElement('div');d.className='item';d.innerHTML='<div class=info><div class=name>'+x.n+'<span class=tag>'+x.a+'</span></div><div class=area>'+x.b+'</div></div>';d.onclick=()=>showMap(x);l.appendChild(d)})}
function search(q){const v=q.trim().toLowerCase();render(v?data.filter(x=>x.n.toLowerCase().includes(v)||x.a.toLowerCase().includes(v)||x.b.toLowerCase().includes(v)):data)}
render(data);
function showMap(x){q('#header').classList.add('hidden');q('#search').parentElement.classList.add('hidden');q('#list').classList.add('hidden');q('#mapWrap').classList.remove('hidden');q('#shopName').textContent=x.n;q('#openBtn').href=x.t;initMap(x.lt,x.ln,x.n)}
function back(){q('#header').classList.remove('hidden');q('#search').parentElement.classList.remove('hidden');q('#list').classList.remove('hidden');q('#mapWrap').classList.add('hidden')}
let map;
function initMap(lat,lng,name){if(map)map.remove();map=L.map('map',{zoomControl:false,attributionControl:false}).setView([lat,lng],17);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);L.marker([lat,lng]).addTo(map).bindPopup(name).openPopup();setTimeout(()=>map.invalidateSize(),100)}
</script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</body>
</html>
