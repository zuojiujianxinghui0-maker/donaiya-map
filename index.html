const list=document.getElementById('list');
const count=document.getElementById('total');
const searchInput=document.getElementById('search');

function render(shops){count.textContent=shops.length;list.innerHTML='';if(shops.length===0){list.innerHTML='<div class="no-result"><div class="big">😕</div>該当する店舗がありません</div>';return}
shops.forEach(function(s){var dc=distClass(s);var dl=distLabel(s);var t=s.name+(s.note?' <span class="tag">'+s.note+'</span>':'');var card=document.createElement('div');card.className='shop-card';card.innerHTML='<div class="name">'+t+'</div><div class="meta"><span class="bldg">'+s.bldg+'</span><span class="dist-badge '+dc+'">'+dl+'</span></div><div class="actions"><a class="btn-map" href="'+s.url+'" target="_blank">📍 場所を開く</a><a class="btn-route" href="https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'" target="_blank">🚶 経路案内</a></div>';list.appendChild(card)})}

function doSearch(q){var query=q||searchInput.value.trim();var nq=norm(query);if(!nq){render(SHOPS);return}
var results=SHOPS.filter(function(s){var t=norm(s.name+' '+(s.note||'')+' '+s.bldg+' '+(BLDG_YOMI[s.bldg]||''));return t.indexOf(nq)!==-1});render(results)}

searchInput.addEventListener('input',function(){doSearch(this.value)});

function showAll(){searchInput.value='';render(SHOPS)}

render(SHOPS);
