*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#d32f2f;--primary-dark:#b71c1c;--bg:#fafafa;--card-bg:#fff;--text:#1a1a1a;--text-secondary:#666;--border:#e0e0e0;--radius:12px;--shadow:0 2px 8px rgba(0,0,0,.08)}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue','Segoe UI','Hiragino Sans','Noto Sans CJK JP',sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.header{background:var(--primary);color:#fff;padding:12px 16px;text-align:center;position:relative;flex-shrink:0}
.header h1{font-size:18px;font-weight:700;letter-spacing:.5px}
.header .sub{font-size:11px;opacity:.8;margin-top:2px}
#map{height:220px;flex-shrink:0;border-bottom:2px solid var(--primary)}
.top-bar{display:flex;gap:8px;padding:10px 12px;background:var(--card-bg);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center}
#search{flex:1;padding:10px 14px;border:2px solid var(--border);border-radius:24px;font-size:15px;outline:none;background:var(--bg);transition:border-color .2s}
#search:focus{border-color:var(--primary)}
.top-bar .count{font-size:13px;color:var(--text-secondary);white-space:nowrap;padding-right:4px}
.top-bar .count strong{color:var(--text);font-weight:700}
#list{flex:1;overflow-y:auto;padding:8px 12px 80px;-webkit-overflow-scrolling:touch}
.shop-card{background:var(--card-bg);border-radius:var(--radius);padding:14px 16px;margin-bottom:8px;box-shadow:var(--shadow);transition:transform .15s}
.shop-card:active{transform:scale(.98)}
.shop-card .name{font-size:15px;font-weight:600;margin-bottom:6px}
.shop-card .name .tag{display:inline-block;background:#fff3e0;color:#e65100;font-size:11px;padding:1px 6px;border-radius:4px;margin-left:4px;font-weight:500}
.shop-card .meta{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--text-secondary)}
.shop-card .meta .bldg{flex:1}
.shop-card .meta .dist-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.dist-badge.near{background:#e8f5e9;color:#2e7d32}
.dist-badge.mid{background:#fff8e1;color:#f57f17}
.dist-badge.far{background:#fce4ec;color:#c62828}
.shop-card .actions{display:flex;gap:8px}
.shop-card .actions a{flex:1;text-align:center;padding:8px 0;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;transition:opacity .15s}
.shop-card .actions a:active{opacity:.7}
.btn-map{background:var(--primary);color:#fff}
.btn-route{background:#f5f5f5;color:var(--text)}
.no-result{text-align:center;padding:60px 20px;color:var(--text-secondary)}
.no-result .big{font-size:48px;margin-bottom:12px}
</style>

function norm(s){return s.replace(/[\s　]/g,'').replace(/[\uFF61-\uFF9F]/g,function(m){return String.fromCharCode(m.charCodeAt(0)-0xFEE0)}).toLowerCase()}

function distLabel(m){var d=Math.round(N([m.lat,m.lng],CENTER));return d<200?'近':d<400?'中':'遠'}
function distClass(m){var d=Math.round(N([m.lat,m.lng],CENTER));return d<200?'near':d<400?'mid':'far'}

function N(a,b){var R=6371e3;var dL=((b[0]-a[0])*Math.PI/180);var dL2=((b[1]-a[1])*Math.PI/180);var a2=Math.sin(dL/2)*Math.sin(dL/2)+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dL2/2)*Math.sin(dL2/2);return 2*R*Math.atan2(Math.sqrt(a2),Math.sqrt(1-a2))}

const list=document.getElementById('list');
const count=document.getElementById('total');
const searchInput=document.getElementById('search');

function addrParts(s) {
  if(!s) return [];
  return s.replace(/東京都豊島区/g,'').replace(/東京都/g,'')
    .split(/[\s　]/).filter(Boolean);
}

function normalizeBldg(s) {
  return s.replace(/第II/g,'第二').replace(/第２/g,'第二').replace(/第2/g,'第二')
    .replace(/第１/g,'第一').replace(/第1/g,'第一');
}

function render(shops){
count.textContent=shops.length;list.innerHTML='';
if(shops.length===0){list.innerHTML='<div class="no-result"><div class="big">😕</div>該当する店舗がありません</div>';return}
shops.forEach(function(s){
var dc=distClass(s);var dl=distLabel(s);
var addrInfo = '';
if(s.addr) addrInfo += ' <span style="font-size:11px;color:#999">'+s.addr+'</span>';
if(s.floor) addrInfo += ' <span style="font-size:11px;color:#999">'+s.floor+'</span>';
var card=document.createElement('div');card.className='shop-card';
card.innerHTML='<div class="name">'+s.name+'</div><div class="meta"><span class="bldg">'+s.bldg+addrInfo+'</span><span class="dist-badge '+dc+'">'+dl+'</span></div><div class="actions"><a class="btn-map" href="'+s.url+'" target="_blank">📍 場所を開く</a><a class="btn-route" href="https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'" target="_blank">🚶 経路案内</a></div>';
list.appendChild(card)})}

function doSearch(q){
var query=q||searchInput.value.trim();
var nq=norm(query);
if(!nq){render(SHOPS);return}
var results=SHOPS.filter(function(s){
  var t=norm(s.name+' '+(SHOP_YOMI[s.name]||'')+' '+(s.bldg||'')+' '+(BLDG_YOMI[s.bldg]||'')+' '+(s.addr||'')+' '+(s.floor||''));
  if(t.indexOf(nq)!==-1) return true;
  if(s.addr) {var na = norm(s.addr);if(na.indexOf(nq)!==-1) return true;}
  if(s.bldg) {var nb = norm(normalizeBldg(s.bldg));var nq2 = norm(normalizeBldg(query));if(nb.indexOf(nq2)!==-1) return true;}
  return false;
});
render(results)}

searchInput.addEventListener('input',function(){doSearch(this.value)});

function showAll(){searchInput.value='';render(SHOPS)}

render(SHOPS);
