<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 赤丸 -->
  <circle cx="256" cy="256" r="248" fill="#E60012"/>
  <!-- 黒枠の白楕円 -->
  <ellipse cx="256" cy="256" rx="175" ry="130" fill="white" stroke="black" stroke-width="8"/>
  <!-- 上部中央：元祖（赤背景白文字・黒枠） -->
  <rect x="190" y="95" width="85" height="35" fill="#CC0000" stroke="black" stroke-width="2.5"/>
  <text x="232" y="120" font-family="'Noto Serif JP', serif" font-size="24" fill="white" text-anchor="middle" font-weight="bold">元祖</text>
  <!-- ど（筆文字風・黒・左側） -->
  <text x="165" y="300" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', serif" font-size="130" fill="black" font-weight="900">ど</text>
  <!-- な（筆文字風・黒・中央・小さめ） -->
  <text x="245" y="285" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', serif" font-size="80" fill="black" font-weight="bold">な</text>
  <!-- や（筆文字風・赤・右側・大きめ） -->
  <text x="315" y="280" font-family="'Noto Serif JP', 'Hiragino Mincho ProN', serif" font-size="140" fill="#E60012" font-weight="900">や</text>
  <!-- TAKOYAKI（下中央） -->
  <text x="256" y="365" font-family="Arial, sans-serif" font-size="34" fill="black" font-weight="bold" letter-spacing="2" text-anchor="middle">TAKOYAKI</text>
</svg>